[Settings]
# 截圖儲存目錄
save_directory = R:\output

# 截圖檔案名稱前綴
file_prefix = page_

# 要執行的截圖次數
screenshot_count = 37
# 每次截圖之間的延遲時間（秒）
delay_between_screenshots = 1

# 是否將訊息印到控制台
print_to_console = True

# 翻頁操作，可選值：RIGHT, LEFT, SPACE, MOUSE_LEFT 或其他有效的鍵盤按鍵
next_page_action = LEFT

# PDF 輸出檔案名稱，如果不需要生成 PDF 則留空
pdf_output = output.pdf

# 截圖模式：full_screen 或 fixed_area
screenshot_mode = fixed_area

# 固定範圍截圖的座標和大小 (僅在 screenshot_mode 為 fixed_area 時使用)
# 格式：x,y,width,height
fixed_area = 0,0,2560,1440

# 圖檔格式：PNG 或 JPG
image_format = JPG

# JPG 格式的壓縮品質 (1-100)，PNG 時會被忽略
image_quality = 80

# 多區塊截圖設定：以 | 分隔多個區塊，格式可為 label:x,y,width,height 或 x,y,width,height
# 範例：capture_regions = left:0,0,960,1080|right:960,0,960,1080
capture_regions = 1280,4,1080,1436|200,4,1080,1436
# 首頁專用多區塊設定，格式同 capture_regions，僅在第一頁套用
capture_first_region = 740,4,1080,1436

# 座標模式：relative 以截圖左上角為 (0,0)，absolute 以螢幕實際座標為基準（會自動扣除固定範圍起點）
capture_coordinate_space = relative
